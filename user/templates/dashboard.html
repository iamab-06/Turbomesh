<!DOCTYPE html>
<html>
<head>
    <title>TurboMesh User</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-sha256/0.9.0/sha256.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: #1e293b;
            --input-bg: #0f172a;
            --border: #334155;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            max-width: 900px; 
            margin: 40px auto; 
            background: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 40px;
            background: -webkit-linear-gradient(#60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        h2 { 
            font-size: 1.4rem;
            color: var(--text-main); 
            margin-top: 0; 
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }
        
        h3 { color: #bae6fd; margin-bottom: 10px; margin-top: 20px;}
        h4 { color: var(--text-muted); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;}

        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            border: 1px solid var(--border);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: border-color 0.3s ease;
        }

        .card:hover { border-color: #475569; }

        .info-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 12px 0; 
            border-bottom: 1px dashed var(--border); 
        }
        .info-row:last-child { border-bottom: none; }
        
        .label { color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: block; margin-bottom: 8px;}
        .info-row .label { margin-bottom: 0; }
        .value { font-weight: 700; color: var(--success); font-family: 'JetBrains Mono', monospace;}

        input, select { 
            background: var(--input-bg); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
            padding: 12px; 
            border-radius: 6px; 
            width: 100%; 
            margin-bottom: 20px; 
            box-sizing: border-box; 
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button { 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: 600; 
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            box-shadow: 0 4px 6px var(--accent-glow);
        }
        
        button:hover:not(:disabled) { background: #2563eb; transform: translateY(-1px); }
        button:disabled { background: var(--border); box-shadow: none; cursor: not-allowed; color: var(--text-muted); }

        #status-box, #job-status-box { 
            text-align: center; 
            font-weight: 600; 
            padding: 12px; 
            margin-top: 20px; 
            border-radius: 6px; 
            display: none; 
            border: 1px solid transparent;
        }
        
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); border-color: rgba(245, 158, 11, 0.3) !important; }
        .status-approved, .status-success { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.3) !important; }
        .status-rejected, .status-error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.3) !important; }

        .progress-bar { 
            width: 100%; 
            background: var(--input-bg); 
            border-radius: 6px; 
            overflow: hidden; 
            margin-top: 15px; 
            display: none; 
            border: 1px solid var(--border);
            height: 12px;
        }
        
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #3b82f6, #60a5fa); 
            width: 0%; 
            transition: width 0.3s ease-out; 
            border-radius: 6px;
        }

        #process-fill { background: linear-gradient(90deg, #10b981, #34d399); }

        #results-area { 
            margin-top: 30px; 
            padding: 24px; 
            background: rgba(15, 23, 42, 0.4); 
            border-radius: 8px; 
            display: none; 
            border: 1px dashed var(--border);
        }
        
        #result-img { 
            max-width: 100%; 
            border-radius: 8px; 
            margin-top: 10px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        pre { 
            background: #000; 
            padding: 16px; 
            overflow-x: auto; 
            border-radius: 8px; 
            color: #34d399; 
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }

        input[type="file"]::file-selector-button {
            background: var(--border);
            color: var(--text-main);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            margin-right: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: #475569; }
    </style>
</head>
<body>
    <h1>TurboMesh User</h1>
    
    <div class='card' id='connection-card'>
        <h2>Connect to Host</h2>
        
        <label class="label">Host IP Address</label>
        <input type="text" id="host_ip" placeholder="e.g. 192.168.1.50" />
        
        <label class="label">Port</label>
        <input type="number" id="port" value="8000" />
        
        <label class="label">Pairing Code</label>
        <input type="text" id="pairing_code" placeholder="Enter 6-digit code from Host" />
        
        <button onclick="connect()">Connect to Host</button>
        <div id="status-box"></div>
    </div>
    
    <div class='card' id='dashboard-card' style="display:none;">
        <h2>Active Connection</h2>
        <div class='info-row'><span class='label'>Status:</span><span class='value'>Authenticated</span></div>
        <div class='info-row'><span class='label'>Host Node IP:</span><span class='value' id='host-ip-val'></span></div>
        
        <h2 style="margin-top:30px;">Dispatch Job</h2>
        <label class="label">AI Operation Target</label>
        <select id="operation" onchange="updateFileInputs()">
            <option value="object_detection">Object Detection & Analytics (YOLOv8 - 1 Image)</option>
            <option value="image_similarity">Deep Image Similarity (ResNet/SSIM - 2 Images)</option>
        </select>
        
        <div id="file-inputs">
            <label class="label">Select Image File</label>
            <input type="file" id="file1" accept="image/*" />
        </div>
        
        <button id="start-job-btn" onclick="startJob()">Create Job & Upload Data</button>
        <div id="job-status-box"></div>
        
        <div class="progress-bar" id="upload-progress"><div class="progress-fill" id="upload-fill"></div></div>
        <div class="progress-bar" id="process-progress"><div class="progress-fill" id="process-fill"></div></div>
        
        <div id="results-area">
            <h3>Processing Results</h3>
            <div id="result-content"></div>
        </div>
    </div>

    <script>
        let pollInterval;
        let authToken = null;
        let hostUrl = null;

        function updateFileInputs() {
            const op = document.getElementById('operation').value;
            const container = document.getElementById('file-inputs');
            if (op === 'object_detection') {
                container.innerHTML = '<label class="label">Select Image File</label><input type="file" id="file1" accept="image/*" />';
            } else {
                container.innerHTML = '<label class="label">Select Image 1</label><input type="file" id="file1" accept="image/*" /><label class="label">Select Image 2</label><input type="file" id="file2" accept="image/*" />';
            }
        }

        async function connect() {
            const host_ip = document.getElementById('host_ip').value;
            const port = parseInt(document.getElementById('port').value);
            const pairing_code = document.getElementById('pairing_code').value;
            
            const sb = document.getElementById('status-box');
            sb.style.display = 'block';
            sb.className = 'status-pending';
            sb.innerText = 'Connecting... Waiting for response';

            try {
                const res = await fetch('/api/pair', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({host_ip, port, pairing_code})
                });
                
                if (res.ok) {
                    sb.innerText = 'Pairing requested. Waiting for Host to ALLOW...';
                    pollInterval = setInterval(checkStatus, 2000);
                } else {
                    const data = await res.json();
                    sb.className = 'status-error';
                    sb.innerText = 'Error: ' + data.detail;
                }
            } catch (e) {
                sb.className = 'status-error';
                sb.innerText = 'Connection failed to User API';
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                if (data.auth.status === 'approved') {
                    if (pollInterval) clearInterval(pollInterval);
                    document.getElementById('connection-card').style.display = 'none';
                    document.getElementById('dashboard-card').style.display = 'block';
                    if (data.host) {
                        document.getElementById('host-ip-val').innerText = data.host.ip;
                    }
                } else if (data.auth.status === 'rejected') {
                    if (pollInterval) clearInterval(pollInterval);
                    const sb = document.getElementById('status-box');
                    sb.className = 'status-error';
                    sb.innerText = 'Connection rejected by Host owner.';
                }
            } catch (e) {}
        }
        
        async function calculateSHA256(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                const hasher = sha256.create();
                const chunkSize = 1024 * 1024;
                let offset = 0;
                
                reader.onload = function(e) {
                    hasher.update(e.target.result);
                    offset += chunkSize;
                    if (offset < file.size) readNext();
                    else resolve(hasher.hex());
                };
                
                function readNext() {
                    reader.readAsArrayBuffer(file.slice(offset, offset + chunkSize));
                }
                readNext();
            });
        }

        async function uploadFile(jobId, file, progressFill) {
            const hash = await calculateSHA256(file);
            const chunkSize = 1024 * 1024;
            const totalChunks = Math.ceil(file.size / chunkSize);
            
            for (let i = 0; i < totalChunks; i++) {
                const chunk = file.slice(i * chunkSize, (i + 1) * chunkSize);
                const formData = new FormData();
                formData.append('chunk_index', i);
                formData.append('filename', file.name);
                formData.append('file', chunk);
                
                const res = await fetch(`/api/jobs/${jobId}/upload/chunk`, { method: 'POST', body: formData });
                if (!res.ok) throw new Error('Chunk upload failed');
                
                progressFill.style.width = ((i + 1) / totalChunks * 100) + '%';
            }
            
            const res = await fetch(`/api/jobs/${jobId}/upload/finalize`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: file.name, total_chunks: totalChunks, expected_size: file.size, expected_sha256: hash })
            });
            if (!res.ok) throw new Error('Finalize failed');
        }

        async function startJob() {
            const op = document.getElementById('operation').value;
            const file1 = document.getElementById('file1')?.files[0];
            const file2 = document.getElementById('file2')?.files[0];
            
            const jsb = document.getElementById('job-status-box');
            jsb.style.display = 'block';
            document.getElementById('results-area').style.display = 'none';
            document.getElementById('process-progress').style.display = 'none';
            
            if (op === 'object_detection' && !file1) { jsb.className = 'status-error'; jsb.innerText = 'Error: Exactly 1 image required.'; return; }
            if (op === 'image_similarity' && (!file1 || !file2)) { jsb.className = 'status-error'; jsb.innerText = 'Error: Exactly 2 images required.'; return; }

            document.getElementById('start-job-btn').disabled = true;
            jsb.className = 'status-pending';
            jsb.innerText = 'Initializing Job on Host...';
            
            try {
                const res = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({operation: op})
                });
                if (!res.ok) throw new Error('Job creation failed');
                const job = await res.json();
                
                jsb.innerText = 'Securely hashing and uploading chunks...';
                document.getElementById('upload-progress').style.display = 'block';
                const fill = document.getElementById('upload-fill');
                fill.style.width = '0%';
                
                await uploadFile(job.job_id, file1, fill);
                if (file2) {
                    fill.style.width = '0%';
                    await uploadFile(job.job_id, file2, fill);
                }
                
                jsb.className = 'status-pending';
                jsb.innerText = 'Upload verified. Awaiting inference stream...';
                
                monitorJob(job.job_id);
            } catch (e) {
                jsb.className = 'status-error';
                jsb.innerText = 'Error: ' + e.message;
                document.getElementById('start-job-btn').disabled = false;
            }
        }

        async function monitorJob(jobId) {
            const statusRes = await fetch('/api/status');
            const statusData = await statusRes.json();
            const token = statusData.raw_token; 
            const hostIp = statusData.host.ip;
            const hostPort = 8000; 
            
            const wsUrl = `ws://${hostIp}:8000/ws/jobs/${jobId}?token=${token}`;
            const ws = new WebSocket(wsUrl);
            const jsb = document.getElementById('job-status-box');
            const pbar = document.getElementById('process-progress');
            const pfill = document.getElementById('process-fill');
            pbar.style.display = 'block';
            
            ws.onmessage = async (event) => {
                const data = JSON.parse(event.data);
                if (data.error) {
                    jsb.className = 'status-error'; jsb.innerText = data.error; ws.close(); return;
                }
                
                jsb.innerText = `Host Status: ${data.status} | Stage: ${data.stage}`;
                pfill.style.width = (data.progress || 0) + '%';
                
                if (data.status === 'COMPLETED') {
                    jsb.className = 'status-success';
                    jsb.innerText = 'AI Inference Complete! Fetching results...';
                    document.getElementById('start-job-btn').disabled = false;
                    await fetchAndDisplayResults(jobId, data.result_files, hostIp, token);
                    ws.close();
                } else if (data.status === 'FAILED') {
                    jsb.className = 'status-error';
                    jsb.innerText = `Inference Failed: ${data.stage}`;
                    document.getElementById('start-job-btn').disabled = false;
                    ws.close();
                }
            };
        }

        async function fetchAndDisplayResults(jobId, files, hostIp, token) {
            const resultsArea = document.getElementById('results-area');
            const content = document.getElementById('result-content');
            resultsArea.style.display = 'block';
            content.innerHTML = '';
            
            for (const file of files) {
                const url = `/api/jobs/${jobId}/result/${file}`;
                
                if (file.endsWith('.json')) {
                    const res = await fetch(url);
                    const data = await res.json();
                    content.innerHTML += `<h4>${file}</h4><pre>${JSON.stringify(data, null, 2)}</pre>`;
                } else if (file.match(/\.(jpg|jpeg|png)$/i)) {
                    content.innerHTML += `<h4>${file}</h4><img id="result-img" src="${url}" />`;
                }
            }
        }

        checkStatus();
    </script>
</body>
</html>
